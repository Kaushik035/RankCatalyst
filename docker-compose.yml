version: "3.9"

services:
  db:
    image: postgres:16
    container_name: rc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rankcatalyst}
      POSTGRES_USER: ${POSTGRES_USER:-rank_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rank_pass}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: rc_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["sh", "-c", "python scripts/wait_for_db.py && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]

  frontend:
    build:
      context: ./frontend
    container_name: rc_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]

volumes:
  db_data:
